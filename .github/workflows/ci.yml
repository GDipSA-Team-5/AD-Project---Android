name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Unit Tests + Coverage + Lint
        run: ./gradlew testDebugUnitTest jacocoTestReport lintDebug

      - name: Copy Reports Index
        run: cp .github/pages/index.html app/build/reports/index.html

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            ./gradlew :app:sonar \
            -Dsonar.projectBaseDir=$GITHUB_WORKSPACE \
            -Dsonar.sources=app/src/main/java \
            -Dsonar.tests=app/src/test/java,app/src/androidTest/java \
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml \
            -Dsonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml \
            -Dsonar.token=$SONAR_TOKEN


      - name: Upload Jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload Reports to Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/reports

  deploy-pages:
    needs: build-test-sonar
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
